<!DOCTYPE html> 
<html lang="uk">
<head>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Party in Lviv</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background-color: #0d0714; color: #f3effa; padding: 16px; padding-bottom: 40px; }
        h1 { font-size: 22px; text-align: center; margin-bottom: 16px; color: #d084ff; text-shadow: 0 0 12px rgba(187, 107, 255, 0.4); }
        .main-tabs { display: flex; background: rgba(35, 18, 56, 0.7); padding: 4px; border-radius: 14px; margin-bottom: 16px; border: 1px solid rgba(187, 107, 255, 0.2); backdrop-filter: blur(10px); gap: 4px; }
        .main-tab-btn { flex: 1; padding: 8px 4px; border: none; background: transparent; color: #a491bc; font-size: 13px; font-weight: bold; border-radius: 10px; cursor: pointer; transition: all 0.25s ease; text-align: center; }
        .main-tab-btn.active { background: linear-gradient(135deg, #a855f7, #7e22ce); color: #ffffff; box-shadow: 0 4px 12px rgba(168, 85, 247, 0.4); }
        
        .categories { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 16px; }
        .categories::-webkit-scrollbar { display: none; }
        .cat-btn { background: rgba(35, 18, 56, 0.6); color: #a491bc; border: 1px solid rgba(187, 107, 255, 0.2); padding: 8px 14px; border-radius: 20px; white-space: nowrap; font-size: 13px; font-weight: 500; cursor: pointer; }
        .cat-btn.active { background: #a855f7; color: #ffffff; border-color: #a855f7; box-shadow: 0 2px 8px rgba(168, 85, 247, 0.3); }
        
        .cards-grid { display: grid; gap: 16px; }
        .card { background: rgba(28, 15, 46, 0.7); border-radius: 16px; overflow: hidden; border: 1px solid rgba(187, 107, 255, 0.15); backdrop-filter: blur(8px); box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4); cursor: pointer; transition: transform 0.2s ease; position: relative; }
        .card:active { transform: scale(0.98); }
        .card-img { width: 100%; height: 160px; object-fit: cover; display: block; }
        .card-body { padding: 14px 16px 16px 16px; }
        
        .fav-btn { position: absolute; top: 12px; right: 12px; background: rgba(13, 7, 20, 0.7); border: 1px solid rgba(187, 107, 255, 0.3); width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; cursor: pointer; z-index: 10; backdrop-filter: blur(6px); transition: all 0.2s ease; }
        .fav-btn:hover { transform: scale(1.1); }
        .fav-btn.active { color: #ff3366; border-color: #ff3366; background: rgba(255, 51, 102, 0.15); }

        .card-badge { display: inline-block; background: rgba(168, 85, 247, 0.2); color: #d084ff; font-size: 11px; font-weight: bold; padding: 4px 8px; border-radius: 6px; border: 1px solid rgba(168, 85, 247, 0.3); }
        .card-title { font-size: 18px; font-weight: bold; margin-bottom: 6px; color: #ffffff; }
        .card-desc { font-size: 13px; color: #bfaed9; margin-bottom: 8px; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .card-meta { font-size: 12px; color: #8c76ab; display: flex; align-items: center; gap: 4px; margin-top: 4px; }
        .card-distance { font-size: 12px; color: #d084ff; font-weight: 500; margin-bottom: 8px; display: flex; align-items: center; gap: 4px; }
        
        .leaflet-div-icon { background: transparent !important; border: none !important; }
        .custom-pin-wrapper { position: relative; display: flex; flex-direction: column; align-items: center; cursor: pointer; transform: translate(-50%, -100%); }
        .pin-small { background: linear-gradient(135deg, #a855f7, #7e22ce); width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; box-shadow: 0 4px 12px rgba(168, 85, 247, 0.6); border: 2px solid #ffffff; position: relative; }
        .pin-small::after { content: ''; position: absolute; bottom: -6px; left: 50%; transform: translateX(-50%); border-width: 6px 5px 0 5px; border-style: solid; border-color: #7e22ce transparent transparent transparent; }
        .pin-large { background: linear-gradient(135deg, #a855f7, #7e22ce); color: #ffffff; padding: 6px 12px; border-radius: 14px; font-weight: 600; font-size: 12px; white-space: nowrap; box-shadow: 0 4px 12px rgba(168, 85, 247, 0.6); border: 1.5px solid #ffffff; position: relative; display: flex; align-items: center; gap: 4px; }
        .pin-large::after { content: ''; position: absolute; bottom: -7px; left: 50%; transform: translateX(-50%); border-width: 7px 6px 0 6px; border-style: solid; border-color: #7e22ce transparent transparent transparent; }
        
        .venue-events-section { margin-top: 16px; padding-top: 16px; border-top: 1px solid rgba(187, 107, 255, 0.2); }
        .venue-events-title { font-size: 15px; font-weight: bold; color: #d084ff; margin-bottom: 12px; }
        .venue-events-scroll { max-height: 260px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; padding-right: 4px; }
        .venue-events-scroll::-webkit-scrollbar { width: 4px; }
        .venue-events-scroll::-webkit-scrollbar-thumb { background: rgba(168, 85, 247, 0.4); border-radius: 4px; }
        .venue-event-card { background: rgba(35, 18, 56, 0.8); border: 1px solid rgba(187, 107, 255, 0.25); border-radius: 14px; overflow: hidden; }
        .venue-event-img { width: 100%; height: 130px; object-fit: cover; display: block; }
        .venue-event-body { padding: 12px; }
        .venue-event-name { font-weight: bold; font-size: 15px; color: #ffffff; margin-bottom: 4px; }
        .venue-event-time { font-size: 12px; color: #d084ff; margin-bottom: 6px; }
        .venue-event-desc { font-size: 12px; color: #bfaed9; line-height: 1.4; }
        
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(10, 5, 18, 0.85); backdrop-filter: blur(12px); display: flex; justify-content: center; align-items: flex-end; z-index: 1000; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; }
        .modal-overlay.open { opacity: 1; pointer-events: auto; }
        .modal-content { background: #180c29; width: 100%; max-height: 85vh; border-top-left-radius: 24px; border-top-right-radius: 24px; padding: 20px; overflow-y: auto; border-top: 1px solid rgba(187, 107, 255, 0.3); box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.8); transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.1, 0.9, 0.2, 1); }
        .modal-overlay.open .modal-content { transform: translateY(0); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
        .modal-close { background: rgba(255, 255, 255, 0.1); border: none; color: #ffffff; width: 32px; height: 32px; border-radius: 50%; font-size: 16px; cursor: pointer; }
        .modal-img { width: 100%; height: 200px; object-fit: cover; border-radius: 14px; margin-bottom: 14px; }
        .btn-action { display: block; width: 100%; background: linear-gradient(135deg, #a855f7, #7e22ce); color: #ffffff; text-align: center; text-decoration: none; padding: 12px; border-radius: 12px; font-weight: bold; font-size: 14px; margin-top: 16px; box-shadow: 0 4px 15px rgba(168, 85, 247, 0.4); }
        .loader { text-align: center; color: #8c76ab; padding: 40px 0; font-size: 14px; }
    </style>
</head>
<body>

    <h1>🍸 Тусовель Львова</h1>

    <div class="main-tabs">
        <button id="tab-places-btn" class="main-tab-btn active" onclick="switchMainTab('places')">🥂 Заклади</button>
        <button id="tab-events-btn" class="main-tab-btn" onclick="switchMainTab('events')">🎉 Події</button>
        <button id="tab-map-btn" class="main-tab-btn" onclick="switchMainTab('map')">🗺 Мапа</button>
        <button id="tab-favs-btn" class="main-tab-btn" onclick="switchMainTab('favorites')">⭐ Обране</button>
    </div>

    <!-- Категорії Закладів -->
    <div id="places-categories-bar" class="categories">
        <button class="cat-btn active" onclick="filterPlaces('all', this)">🔥 Усі</button>
        <button class="cat-btn" onclick="filterPlaces('Бар', this)">🍻 Бари / Пиво</button>
        <button class="cat-btn" onclick="filterPlaces('Live', this)">🎸 Live / Музика</button>
        <button class="cat-btn" onclick="filterPlaces('Стендап', this)">🎤 Шоу / Стендап</button>
    </div>

    <!-- Фільтри Дати для Подій -->
    <div id="events-date-bar" class="categories" style="display: none;">
        <button class="cat-btn active" onclick="filterEvents('all', this)">🔥 Усі дати</button>
        <button class="cat-btn" onclick="filterEvents('today', this)">⚡ Сьогодні</button>
        <button class="cat-btn" onclick="filterEvents('tomorrow', this)">🌙 Завтра</button>
        <button class="cat-btn" onclick="filterEvents('weekend', this)">🎉 Вихідні</button>
    </div>

    <div id="map-container" style="display: none; width: 100%; height: 75vh; border-radius: 16px; border: 1px solid rgba(187, 107, 255, 0.2); overflow: hidden; position: relative;"></div>
    
    <div id="content-list" class="cards-grid">
        <div class="loader">⏳ Завантаження тусовок...</div>
    </div>

    <div id="modal" class="modal-overlay" onclick="closeModal(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <div class="modal-header">
                <span id="modal-badge" class="card-badge">Категорія</span>
                <button class="modal-close" onclick="closeModal()">✕</button>
            </div>
            <img id="modal-img" src="" class="modal-img" style="display:none;">
            <h2 id="modal-title" style="margin-bottom: 8px; color: #fff;"></h2>
            <div id="modal-meta" class="card-meta" style="margin-bottom: 12px;"></div>
            <p id="modal-desc" style="color: #bfaed9; font-size: 14px; line-height: 1.5;"></p>
            
            <div id="modal-events-list"></div>

            <a id="modal-btn" href="#" target="_blank" class="btn-action" style="display:none;">🗺 Відкрити в Google Maps</a>
        </div>
    </div>

    <script>
        let userLocation = null;

        function initGeolocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        userLocation = {
                            lat: position.coords.latitude,
                            lon: position.coords.longitude
                        };
                    },
                    (error) => {
                        console.log("Користувач не поділився геопозицією");
                        userLocation = null;
                    }
                );
            }
        }

        function getDistanceMeters(lat1, lon1, lat2, lon2) {
            const R = 6371e3;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = 
                Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * 
                Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c;
        }

        function formatDistanceText(lat, lon) {
            if (!userLocation) return "";
            const meters = getDistanceMeters(userLocation.lat, userLocation.lon, lat, lon);
            if (meters < 1000) {
                return `${Math.round(meters)} м від мене`;
            } else {
                return `${(meters / 1000).toFixed(1)} км від мене`;
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            initGeolocation();
        });

        const API_URL = "https://script.google.com/macros/s/AKfycbzHkKm2jhWes-KrKUcY5w7Yq5gCvp4ELum8sprFGfER20Tl6Ar2t21ghziV_M8AUUcBbg/exec";
        let dbData = { Заклади: [], Події: [] };
        let currentTab = 'places';
        let currentPlaceFilter = 'all';
        let currentEventDateFilter = 'all';

        function getFavorites() {
            try { return JSON.parse(localStorage.getItem('lviv_party_favs') || '[]'); } catch (e) { return []; }
        }

        function toggleFavorite(type, id, event) {
            event.stopPropagation();
            let favs = getFavorites();
            const index = favs.findIndex(f => f.type === type && f.id === id);
            if (index > -1) favs.splice(index, 1);
            else favs.push({ type, id });
            localStorage.setItem('lviv_party_favs', JSON.stringify(favs));
            renderContent();
        }

        function isFavorite(type, id) {
            return getFavorites().some(f => f.type === type && f.id === id);
        }

        if (window.Telegram && window.Telegram.WebApp) {
            const tg = window.Telegram.WebApp;
            tg.ready();
            tg.expand();
            const user = tg.initDataUnsafe?.user;
            if (user) {
                fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ action: 'track_user', user: { id: user.id, username: user.username || 'не вказано', first_name: user.first_name || 'не вказано' } })
                }).catch(err => console.error(err));
            }
        }

        async function loadData() {
            try {
                const res = await fetch(API_URL);
                dbData = await res.json();
                renderContent();
            } catch (err) {
                document.getElementById('content-list').innerHTML = '<div class="loader" style="color:#ff5252;">❌ Помилка завантаження даних</div>';
            }
        }

        function matchDateFilter(dateStr, filter) {
            if (filter === 'all' || !dateStr) return true;
            const lowerStr = String(dateStr).toLowerCase();
            const now = new Date();
            const formatDate = (d) => `${String(d.getDate()).padStart(2, '0')}.${String(d.getMonth() + 1).padStart(2, '0')}`;
            const todayStr = formatDate(now);
            const tomorrowObj = new Date(now);
            tomorrowObj.setDate(now.getDate() + 1);
            const tomorrowStr = formatDate(tomorrowObj);

            if (filter === 'today') {
                return lowerStr.includes('сьогодні') || lowerStr.includes(todayStr);
            }
            if (filter === 'tomorrow') {
                return lowerStr.includes('завтра') || lowerStr.includes(tomorrowStr);
            }
            if (filter === 'weekend') {
                if (lowerStr.includes('субота') || lowerStr.includes('неділя') || lowerStr.includes('вихідн')) {
                    return true;
                }
                const currentDay = now.getDay();
                const distToSat = (6 - currentDay + 7) % 7;
                const distToSun = (0 - currentDay + 7) % 7;
                const satObj = new Date(now);
                satObj.setDate(now.getDate() + distToSat);
                const satStr = formatDate(satObj);
                const sunObj = new Date(now);
                sunObj.setDate(now.getDate() + distToSun);
                const sunStr = formatDate(sunObj);
                return lowerStr.includes(satStr) || lowerStr.includes(sunStr);
            }
            return true;
        }

        function renderContent() {
            const container = document.getElementById('content-list');
            
            if (currentTab === 'favorites') {
                const favs = getFavorites();
                const places = dbData['Заклади'] || dbData['заклади'] || [];
                const events = dbData['Події'] || [];
                let html = '';
                
                favs.forEach(fav => {
                    if (fav.type === 'place' && places[fav.id]) {
                        const p = places[fav.id];
                        const lat = p['Широта'] || p['Lat'] || p['lat'];
                        const lon = p['Довгота'] || p['Lon'] || p['lng'] || p['lon'];
                        const distanceText = (lat && lon) ? formatDistanceText(parseFloat(lat), parseFloat(lon)) : '';

                        html += `
                            <div class="card" onclick="openPlaceModal(${fav.id})">
                                <div class="fav-btn active" onclick="toggleFavorite('place', ${fav.id}, event)">♥</div>
                                ${p['Фото (посилання)'] || p['Фото'] || p['Image'] ? `<img src="${p['Фото (посилання)'] || p['Фото'] || p['Image']}" class="card-img" alt="Фото">` : ''}
                                <div class="card-body">
                                    <span class="card-badge">${p['Категорія'] || 'Бар / Тусовка'}</span>
                                    <div class="card-title">${p['Назва закладу'] || p['Назва'] || ''}</div>
                                    <div class="card-desc">${p['Опис / Вайб'] || p['Опис'] || ''}</div>
                                    ${distanceText ? `<div class="card-distance">🚶‍♂️ ${distanceText}</div>` : ''}
                                    <div class="card-meta">📍 ${p['Адреса'] || 'Львів'}</div>
                                </div>
                            </div>
                        `;
                    } else if (fav.type === 'event' && events[fav.id]) {
                        const e = events[fav.id];
                        const price = e['Ціна'] || e['Ціна при вході'] || e['Вартість'] || '';
                        const lat = e['Широта'] || e['Lat'] || e['lat'];
                        const lon = e['Довгота'] || e['Lon'] || e['lng'] || e['lon'];
                        const distanceText = (lat && lon) ? formatDistanceText(parseFloat(lat), parseFloat(lon)) : '';

                        html += `
                            <div class="card" onclick="openEventModal(${fav.id})">
                                <div class="fav-btn active" onclick="toggleFavorite('event', ${fav.id}, event)">♥</div>
                                ${e['Афіша (посилання)'] || e['Фото'] ? `<img src="${e['Афіша (посилання)'] || e['Фото']}" class="card-img" alt="Афіша">` : ''}
                                <div class="card-body">
                                    <div style="display: flex; gap: 6px; margin-bottom: 8px; flex-wrap: wrap;">
                                        <span class="card-badge">📅 ${e['Дата та час'] || 'Незабаром'}</span>
                                        <span class="card-badge" style="background: rgba(212, 143, 255, 0.15); border-color: rgba(212, 143, 255, 0.3); color: #e8c5ff;">💵 ${price ? price : 'Ціна'}</span>
                                    </div>
                                    <div class="card-title">${e['Назва події'] || e['Назва'] || ''}</div>
                                    ${distanceText ? `<div class="card-distance">🚶‍♂️ ${distanceText}</div>` : ''}
                                    <div class="card-meta">🏛 ${e['Заклад'] || e['Локація'] || ''}</div>
                                </div>
                            </div>
                        `;
                    }
                });
                container.innerHTML = html || '<div class="loader">У вас ще немає збережених закладів чи подій ⭐<br>Натискайте сердечко на картках!</div>';
                return;
            }

            if (currentTab === 'places') {
                let places = dbData['Заклади'] || dbData['заклади'] || [];
                if (currentPlaceFilter !== 'all') {
                    places = places.filter(p => {
                        const cat = String(p['Категорія'] || p['Опис / Вайб'] || '').toLowerCase();
                        return cat.includes(currentPlaceFilter.toLowerCase());
                    });
                }
                if (places.length === 0) {
                    container.innerHTML = '<div class="loader">Закладів не знайдено 😔</div>';
                    return;
                }
                container.innerHTML = places.map((p, idx) => {
                    const isFav = isFavorite('place', idx);
                    const lat = p['Широта'] || p['Lat'] || p['lat'];
                    const lon = p['Довгота'] || p['Lon'] || p['lng'] || p['lon'];
                    const distanceText = (lat && lon) ? formatDistanceText(parseFloat(lat), parseFloat(lon)) : '';

                    return `
                        <div class="card" onclick="openPlaceModal(${idx})">
                            <div class="fav-btn ${isFav ? 'active' : ''}" onclick="toggleFavorite('place', ${idx}, event)">${isFav ? '♥' : '♡'}</div>
                            ${(p['Фото (посилання)'] || p['Фото'] || p['Image']) ? `<img src="${p['Фото (посилання)'] || p['Фото'] || p['Image']}" class="card-img" alt="Фото">` : ''}
                            <div class="card-body">
                                <span class="card-badge">${p['Категорія'] || 'Бар / Тусовка'}</span>
                                <div class="card-title">${p['Назва закладу'] || p['Назва'] || ''}</div>
                                <div class="card-desc">${p['Опис / Вайб'] || p['Опис'] || ''}</div>
                                ${distanceText ? `<div class="card-distance">🚶‍♂️ ${distanceText}</div>` : ''}
                                <div class="card-meta">📍 ${p['Адреса'] || 'Львів'}</div>
                                ${(p['Графік'] || p['Час роботи']) ? `<div class="card-meta" style="margin-top: 4px; color: #d084ff;">🕒 ${p['Графік'] || p['Час роботи']}</div>` : ''}
                            </div>
                        </div>
                    `;
                }).join('');
            } else {
                let events = dbData['Події'] || [];
                if (currentEventDateFilter !== 'all') {
                    events = events.filter(e => matchDateFilter(e['Дата та час'], currentEventDateFilter));
                }
                if (events.length === 0) {
                    container.innerHTML = '<div class="loader">На обрану дату подій не знайдено 🎉</div>';
                    return;
                }
                container.innerHTML = events.map((e, idx) => {
                    const price = e['Ціна'] || e['Ціна при вході'] || e['Вартість'] || '';
                    const isFav = isFavorite('event', idx);
                    const lat = e['Широта'] || e['Lat'] || e['lat'];
                    const lon = e['Довгота'] || e['Lon'] || e['lng'] || e['lon'];
                    const distanceText = (lat && lon) ? formatDistanceText(parseFloat(lat), parseFloat(lon)) : '';

                    return `
                        <div class="card" onclick="openEventModal(${idx})">
                            <div class="fav-btn ${isFav ? 'active' : ''}" onclick="toggleFavorite('event', ${idx}, event)">${isFav ? '♥' : '♡'}</div>
                            ${e['Афіша (посилання)'] || e['Фото'] ? `<img src="${e['Афіша (посилання)'] || e['Фото']}" class="card-img" alt="Афіша">` : ''}
                            <div class="card-body">
                                <div style="display: flex; gap: 6px; margin-bottom: 8px; flex-wrap: wrap;">
                                    <span class="card-badge">📅 ${e['Дата та час'] || 'Незабаром'}</span>
                                    <span class="card-badge" style="background: rgba(212, 143, 255, 0.15); border-color: rgba(212, 143, 255, 0.3); color: #e8c5ff;">💵 ${price ? price : 'Ціна'}</span>
                                </div>
                                <div class="card-title">${e['Назва події'] || e['Назва'] || ''}</div>
                                <div class="card-desc" style="margin-top: 4px;">${e['Опис події'] || e['Опис'] || ''}</div>
                                ${distanceText ? `<div class="card-distance">🚶‍♂️ ${distanceText}</div>` : ''}
                                <div class="card-meta">🏛 ${e['Заклад'] || e['Локація'] || ''}</div>
                            </div>
                        </div>
                    `;
                }).join('');
            }
        }

        function openPlaceModal(idx) {
            const places = dbData['Заклади'] || dbData['заклади'] || [];
            const p = places[idx];
            if (!p) return;

            document.getElementById('modal-badge').innerText = p['Категорія'] || 'Заклад';
            document.getElementById('modal-title').innerText = p['Назва закладу'] || p['Назва'] || '';
            let metaHtml = `📍 ${p['Адреса'] || 'Львів'}`;
            if (p['Графік'] || p['Час роботи']) metaHtml += `<br>🕒 ${p['Графік'] || p['Час роботи']}`;
            document.getElementById('modal-meta').innerHTML = metaHtml;
            document.getElementById('modal-desc').innerText = p['Опис / Вайб'] || p['Опис'] || '';

            const venueName = (p['Назва закладу'] || p['Назва'] || '').toLowerCase().trim();
            const venueEvents = (dbData['Події'] || []).filter(e => {
                const eventVenue = String(e['Заклад'] || e['Локація'] || '').toLowerCase().trim();
                return eventVenue !== '' && (eventVenue.includes(venueName) || venueName.includes(eventVenue));
            });

            const eventsContainer = document.getElementById('modal-events-list');
            if (venueEvents.length > 0) {
                eventsContainer.innerHTML = `
                    <div class="venue-events-section">
                        <div class="venue-events-title">🎉 Афіша подій у закладі:</div>
                        <div class="venue-events-scroll">
                            ${venueEvents.map(e => `
                                <div class="venue-event-card">
                                    ${(e['Афіша (посилання)'] || e['Фото']) ? `<img src="${e['Афіша (посилання)'] || e['Фото']}" class="venue-event-img" alt="Афіша події">` : ''}
                                    <div class="venue-event-body">
                                        <div class="venue-event-name">${e['Назва події'] || e['Назва'] || ''}</div>
                                        <div class="venue-event-time">📅 ${e['Дата та час'] || 'Незабаром'}</div>
                                        ${(e['Опис події'] || e['Опис']) ? `<div class="venue-event-desc">${e['Опис події'] || e['Опис']}</div>` : ''}
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            } else {
                eventsContainer.innerHTML = '';
            }

            const img = document.getElementById('modal-img');
            const photoUrl = p['Фото (посилання)'] || p['Фото'] || p['Image'];
            if (photoUrl) { img.src = photoUrl; img.style.display = 'block'; } else { img.style.display = 'none'; }

            const btn = document.getElementById('modal-btn');
            const mapUrl = p['Карта'] || p['Посилання на карту'] || p['Google Maps'];
            if (mapUrl) {
                btn.href = mapUrl; btn.innerText = '🗺 Відкрити в Google Maps'; btn.style.display = 'block';
            } else if (p['Адреса']) {
                btn.href = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(p['Адреса'] + ', Львів')}`;
                btn.innerText = '🗺 Шукати адресу на карті'; btn.style.display = 'block';
            } else {
                btn.style.display = 'none';
            }
            document.getElementById('modal').classList.add('open');
        }

        function openEventModal(idx) {
            const events = dbData['Події'] || [];
            const e = events[idx];
            if (!e) return;

            const priceText = e['Ціна'] || e['Ціна при вході'] || e['Вартість'] ? ` | 💵 ${e['Ціна'] || e['Ціна при вході'] || e['Вартість']}` : '';
            document.getElementById('modal-badge').innerText = `📅 ${e['Дата та час'] || 'Незабаром'}${priceText}`;
            document.getElementById('modal-title').innerText = e['Назва події'] || e['Назва'] || '';
            document.getElementById('modal-meta').innerHTML = `🏛 ${e['Заклад'] || e['Локація'] || ''}`;
            document.getElementById('modal-desc').innerText = e['Опис події'] || e['Опис'] || '';
            document.getElementById('modal-events-list').innerHTML = '';

            const img = document.getElementById('modal-img');
            const photoUrl = e['Афіша (посилання)'] || e['Фото'];
            if (photoUrl) { img.src = photoUrl; img.style.display = 'block'; } else { img.style.display = 'none'; }

            const btn = document.getElementById('modal-btn');
            const ticketUrl = e['Квитки'] || e['Посилання'];
            if (ticketUrl) {
                btn.href = ticketUrl;
                btn.innerText = '🎟 Придбати квитки / Детальніше';
                btn.style.display = 'block';
            } else {
                btn.style.display = 'none';
            }
            document.getElementById('modal').classList.add('open');
        }

        function closeModal(e) {
            if (!e || e.target.classList.contains('modal-overlay') || e.target.classList.contains('modal-close')) {
                document.getElementById('modal').classList.remove('open');
            }
        }

        let map = null;
        let placeMarkers = [];

        function switchMainTab(tab) {
            currentTab = tab;
            document.getElementById('tab-places-btn').className = `main-tab-btn ${tab === 'places' ? 'active' : ''}`;
            document.getElementById('tab-events-btn').className = `main-tab-btn ${tab === 'events' ? 'active' : ''}`;
            document.getElementById('tab-map-btn').className = `main-tab-btn ${tab === 'map' ? 'active' : ''}`;
            document.getElementById('tab-favs-btn').className = `main-tab-btn ${tab === 'favorites' ? 'active' : ''}`;
            
            document.getElementById('places-categories-bar').style.display = (tab === 'places' ? 'flex' : 'none');
            document.getElementById('events-date-bar').style.display = (tab === 'events' ? 'flex' : 'none');
            
            const contentList = document.getElementById('content-list');
            const mapContainer = document.getElementById('map-container');

            if (tab === 'map') {
                contentList.style.display = 'none';
                mapContainer.style.display = 'block';
                setTimeout(() => { if (map) map.invalidateSize(); else initMap(); }, 150);
            } else {
                contentList.style.display = 'grid';
                mapContainer.style.display = 'none';
                renderContent();
            }
        }

        function getCategoryIcon(placeData) {
            const customIcon = placeData['Іконка'] || placeData['Смайлик'] || placeData['Emoji'];
            return (customIcon && String(customIcon).trim() !== '') ? String(customIcon).trim() : '🍸';
        }

        function createMarkerHtml(venueName, placeData, isLarge) {
            const icon = getCategoryIcon(placeData);
            return isLarge 
                ? `<div class="custom-pin-wrapper"><div class="pin-large">${icon} ${venueName}</div></div>`
                : `<div class="custom-pin-wrapper"><div class="pin-small">${icon}</div></div>`;
        }

        function updateMarkersZoom() {
            if (!map) return;
            const isLarge = map.getZoom() >= 17;
            placeMarkers.forEach(item => {
                item.marker.setIcon(L.divIcon({
                    className: 'venue-marker',
                    html: createMarkerHtml(item.name, item.placeData, isLarge),
                    iconAnchor: [0, 0]
                }));
            });
        }

        function initMap() {
            const places = dbData['Заклади'] || dbData['заклади'] || [];
            if (!map) {
                map = L.map('map-container', { zoomControl: true }).setView([49.842957, 24.031111], 14);
                L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '&copy; OpenStreetMap' }).addTo(map);
            }
            
            placeMarkers.forEach(item => map.removeLayer(item.marker));
            placeMarkers = [];

            const isLarge = map.getZoom() >= 17;

            places.forEach((p, idx) => {
                const rawCoords = p['Широта'] ? `${p['Широта']},${p['Довгота']}` : (p['Координати'] || p['Координаты'] || p['Coordinates']);
                if (!rawCoords) return;
                const parts = String(rawCoords).split(',');
                if (parts.length < 2) return;
                const lat = parseFloat(parts[0]);
                const lng = parseFloat(parts[1]);

                if (!isNaN(lat) && !isNaN(lng)) {
                    const venueName = p['Назва закладу'] || p['Назва'] || 'Заклад';
                    const venueIcon = L.divIcon({
                        className: 'venue-marker',
                        html: createMarkerHtml(venueName, p, isLarge),
                        iconAnchor: [0, 0]
                    });
                    const marker = L.marker([lat, lng], { icon: venueIcon }).addTo(map);
                    marker.on('click', () => openPlaceModal(idx));
                    placeMarkers.push({ marker, name: venueName, placeData: p });
                }
            });

            map.off('zoomend', updateMarkersZoom);
            map.on('zoomend', updateMarkersZoom);
        }

        function filterPlaces(category, btn) {
            document.querySelectorAll('#places-categories-bar .cat-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentPlaceFilter = category;
            renderContent();
        }

        function filterEvents(dateFilter, btn) {
            document.querySelectorAll('#events-date-bar .cat-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentEventDateFilter = dateFilter;
            renderContent();
        }

        loadData();
    </script>
</body>
</html>
